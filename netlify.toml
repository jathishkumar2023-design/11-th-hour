[build]
  command = "npm run build"
  publish = "dist"

# If hosting backend separately (e.g. Render/Cloud Run), proxy API calls seamlessly:
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend.onrender.com/api/:splat"
#   status = 200
#   force = true

# Standard Single Page Application (SPA) redirect rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
